<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#14111F" />
  <title>BrightReach Virtual Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-frame">
    <div class="app-shell">

      <!-- ============================================================
           Sidebar — decorative chrome to match the reference design.
           "New Chat" is functionally wired (clears the session and
           starts fresh); the history list is a static empty state since
           this widget doesn't currently persist multiple conversations
           per visitor. Hidden entirely on small screens.
           ============================================================ -->
      <aside class="sidebar" aria-label="Conversation sidebar">
        <div class="sidebar__brand">
          <div class="sidebar__logo" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 3C7.03 3 3 6.58 3 11c0 2.42 1.23 4.6 3.17 6.07-.1.9-.42 2.13-1.17 3.43a.5.5 0 0 0 .58.73c1.98-.6 3.4-1.42 4.24-1.98A11.4 11.4 0 0 0 12 19c4.97 0 9-3.58 9-8s-4.03-8-9-8z" fill="currentColor"/>
            </svg>
          </div>
          <div class="sidebar__names">
            <div class="sidebar__name">BrightReach</div>
            <div class="sidebar__sub">Virtual Assistant</div>
          </div>
        </div>

        <button type="button" class="sidebar__new-chat" id="new-chat-button">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          New chat
        </button>

        <label class="sidebar__search" for="sidebar-search-input">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          <input id="sidebar-search-input" type="text" placeholder="Search conversations…" disabled />
        </label>

        <div class="sidebar__section-label">History</div>

        <div class="sidebar__history" aria-hidden="true">
          <div class="sidebar__empty">
            <svg viewBox="0 0 24 24" width="26" height="26" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v9a2.5 2.5 0 0 1-2.5 2.5H9l-4 3.5V17H6.5A2.5 2.5 0 0 1 4 14.5v-9Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
            </svg>
            <p>Conversations will appear here once you start chatting.</p>
          </div>
        </div>

        <div class="sidebar__footer">
          <div class="sidebar__avatar">V</div>
          <div class="sidebar__footer-text">
            <div class="sidebar__footer-name">Visitor</div>
            <div class="sidebar__footer-plan">brightreach.digital</div>
          </div>
        </div>
      </aside>

      <!-- ============================================================
           Main chat pane — same functional structure/IDs as before,
           restyled to match a polished, product-grade layout.
           ============================================================ -->
      <div class="chat-shell">
        <header class="chat-header">
          <div class="chat-header__badge" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 3C7.03 3 3 6.58 3 11c0 2.42 1.23 4.6 3.17 6.07-.1.9-.42 2.13-1.17 3.43a.5.5 0 0 0 .58.73c1.98-.6 3.4-1.42 4.24-1.98A11.4 11.4 0 0 0 12 19c4.97 0 9-3.58 9-8s-4.03-8-9-8z" fill="currentColor"/>
            </svg>
          </div>
          <div class="chat-header__text">
            <div class="chat-header__title-row">
              <h1>BrightReach AI</h1>
              <span class="chat-header__badge-pill">
                <span class="status-dot" aria-hidden="true"></span>Online
              </span>
            </div>
            <p>Usually replies in a few seconds</p>
          </div>
        </header>

        <main class="chat-log" id="chat-log" aria-live="polite">
          <!-- Messages are inserted here by app.js -->
        </main>

        <div class="typing-row" id="typing-row" hidden>
          <div class="bubble bubble--bot bubble--status">
            <span class="status-dots" aria-hidden="true"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>
            <span class="status-text" id="status-text">Thinking…</span>
          </div>
        </div>

        <form class="chat-input" id="chat-form" autocomplete="off">
          <svg class="chat-input__icon" viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M21.44 11.05l-9.19 9.19a5.5 5.5 0 0 1-7.78-7.78l9.19-9.19a3.5 3.5 0 0 1 4.95 4.95l-9.2 9.19a1.5 1.5 0 0 1-2.12-2.12l8.49-8.48" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <input
            type="text"
            id="chat-input"
            name="message"
            placeholder="Ask about services, pricing, or book a call…"
            aria-label="Type your message"
            required
          />
          <button type="submit" aria-label="Send message">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M4 12L20 4L13 20L11 13L4 12Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
            </svg>
          </button>
        </form>

        <p class="chat-disclaimer">BrightReach AI can make mistakes. Consider verifying important information.</p>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
